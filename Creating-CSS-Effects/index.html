<!DOCTYPE html>
<html lang="en">

<head>
    <title>Creating Effects with CSS</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">
    <style>
body {
  font-family: "Sofia", sans-serif;
}
</style>
</head>

<body>
    <!--NavBar-->
    <nav class="nav-bar">
        <ul>
            <li>
                <a href="#">Home</a>
            </li>
            <li class="drop">
                <a href="#">Images</a>
                <div class="rollover-menu">
                    <a href="#image1">Image 1</a>
                    <a href="#image2">Image 2</a>
                    <a href="#image3">Image 3</a>
                </div>
            </li>
        </ul>
    </nav>
    <!--Images-->
    <section>
        <!--Image 1-->
        <div class="image-container" id="image1">
            <img src="images/temple1">
            <div class="overlay"></div>
        </div>

        <div class="image-container" id="image2">
            <img src="images/temple2.webp" class="zoom">
        </div>
        <!--Image 3-->
        <div class="image-container" id="image3">
            <div class="circle">
                <img src="images/temple3.jpg">
            </div>
        </div>
    </section>
    <!--Footer-->
    <footer>
        <div class="footer-text">
            <p>The Tech Academy &copy;</p>
        </div>
    </footer>

</html>
